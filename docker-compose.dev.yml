services:
  arqode-website-dev:
    image: node:22-alpine
    container_name: arqode-website-dev
    working_dir: /app

    ports:
      - "3000:3000"

    env_file:
      - .env.development

    environment:
      - WATCHPACK_POLLING=true

    volumes:
      - .:/app
      - arqode_node_modules:/app/node_modules
      - arqode_next_cache:/app/.next

    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@10.24.0 --activate &&
        pnpm install &&
        pnpm dev --hostname 0.0.0.0
      "

volumes:
  arqode_node_modules:
  arqode_next_cache:
