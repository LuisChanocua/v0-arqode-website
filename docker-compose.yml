services:
  arqode-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: arqode-website:latest
    container_name: arqode-website
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SITE_URL=https://arqode.mx
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    networks:
      - proxy-manager_default
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  proxy-manager_default:
    external: true
