services:
  arqode-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: arqode-website:latest
    container_name: arqode-website
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SITE_URL=https://arqode.mx
    restart: unless-stopped
    networks:
      - proxy-manager_default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy-manager_default:
    external: true